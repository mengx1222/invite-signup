[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "invite-signup"
version = "0.2.0"
description = "A reusable pipeline for invite-gated registration: probe, verdict, run, independent verification"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "requests>=2.31.0",
    "playwright>=1.40.0",
]

[project.optional-dependencies]
web = ["flask>=3.0"]
dev = ["pytest>=7.0.0"]

[project.scripts]
invite-signup = "invitesignup.cli:main"

[tool.setuptools.packages.find]
include = ["invitesignup*"]

[tool.pytest.ini_options]
testpaths = ["tests"]