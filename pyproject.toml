[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "invite-signup"
version = "0.2.0"
description = "A reusable pipeline for invite-gated registration: probe, verdict, run, independent verification"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "requests>=2.31.0",
    "playwright>=1.40.0",
]

[project.optional-dependencies]
web = ["flask>=3.0"]
dev = ["pytest>=7.0.0"]

[project.scripts]
invite-signup = "invitesignup.cli:main"

[tool.setuptools.packages.find]
include = ["invitesignup*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# Lint scope is deliberately narrow.  `ruff check --select ALL` reports 422
# issues here, most of them modernisation of typing syntax (Dict -> dict) that
# would touch every file for no behavioural gain.  These two families catch
# the things that actually bite: unused or undefined names (F) and syntax /
# import errors (E9).
#
# Widening this is a separate change with its own diff; turning on everything
# at once would have made the first CI run red for style reasons and taught
# everyone to ignore it.
[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["F", "E9"]